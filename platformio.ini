; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = tdeck
boards_dir = boards
lib_dir = lib

[env:tdeck]
platform = espressif32@6.3.0
board = T-Deck
framework = arduino
lib_extra_dirs = vendor
monitor_speed = 115200
upload_speed = 921600
build_flags =
	-Iinclude
	-DPDA_CHAT=1
	-DLV_CONF_PATH=lv_conf_pda.h
	-DBOARD_HAS_PSRAM=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DARDUINO_LOOP_STACK_SIZE=32768
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-DCONFIG_BT_NIMBLE_LOG_LEVEL=5
	-DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
lib_deps = h2zero/NimBLE-Arduino@1.4.3
board_build.embed_files =
	data/ai/intent_pt.bin
